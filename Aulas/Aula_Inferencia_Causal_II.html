## Recapitulando

.pull-left[
- O uso de modelos estatísticos para estimativas de efeitos causais depende de um modelo causal subjacente.
- O modelo causal pode ser representado por um DAG, que representa um conjunto de hipóteses sobre as independências condicionais entre as variáveis.
- Todas as relações contidas nos DAGs podem ser decompostas em 3 tipos de estruturas: **cadeias** (pipes), **bifurcações** (forks) e **colisores** (colliders).
- Cada tipo de relação tem implicações diferentes para o efeito estimado por um modelo estatístico.
]
.pull-right[
**Cadeia (pipe)**

&lt;img src="figures/DAGS/pipe.svg" alt="" width="90%" style="display: block; margin: auto;" /&gt;

**Bifurcação (fork)**

&lt;img src="figures/DAGS/fork.svg" alt="" width="90%" style="display: block; margin: auto;" /&gt;

**Colisor (collider)**

&lt;img src="figures/DAGS/colider.svg" alt="" width="90%" style="display: block; margin: auto;" /&gt;
]

## Usando DAGs para construir modelos

.pull-left[
- Se representarmos nossas relações causais propostas por meio de DAGs, teremos um conjunto de regras que nos informa quais variáveis incluir no modelo para estimar determinado efeito.

- **do-calculus**: Existem regras matemáticas que permitem derivar o efeito causal de uma variável sobre outra a partir de um DAG.


$$
`\begin{aligned}
x_1 &amp;= \mathcal{f}(u_1) \\
x_2 &amp;= \mathcal{f}(x_1, u_2) \\
x_3 &amp;= \mathcal{f}(x_1, u_3) \\
x_4 &amp;= \mathcal{f}(x_2, x_3, u_4) \\
x_5 &amp;= \mathcal{f}(x_4, u_5)
\end{aligned}`
$$

]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-xy-condicionado-nou-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
] 

---

## Representando intervenções

.pull-left-40[

- Vamos imaginar uma intervenção na variável "regador" (`\(x_2\)`), que é uma variável que podemos manipular. A intervenção é representada por um nó de ação `\(do(x_2)\)`, que remove todas as setas que entram em `\(x_2\)`.

$$
`\begin{aligned}
x_1 &amp;= \mathcal{f}(u_1) \\
x_2 &amp;= \mathcal{f}(x_1, u_2) \\
x_3 &amp;= \mathcal{f}(x_1, u_3) \\
x_4 &amp;= \mathcal{f}(x_2, x_3, u_4) \\
x_5 &amp;= \mathcal{f}(x_4, u_5)
\end{aligned}`
$$

]
.pull-right-60[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-xy-condicionado-chuva-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
] 

---

## Representando intervenções

.pull-left-40[

- Vamos imaginar uma intervenção na variável "regador" (`\(x_2\)`), que é uma variável que podemos manipular. A intervenção é representada por um nó de ação `\(do(x_2)\)`, que remove todas as setas que entram em `\(x_2\)`.

$$
`\begin{aligned}
x_1 &amp;= \mathcal{f}(u_1) \\
x_2^* &amp;= \mathrm{do}(x_2 = \text{ligado}) \\
x_3 &amp;= \mathcal{f}(x_1, u_3) \\
x_4 &amp;= \mathcal{f}(x_2^*, x_3, u_4) \\
x_5 &amp;= \mathcal{f}(x_4, u_5)
\end{aligned}`
$$

]
.pull-right-60[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-xy-condicionado-chuva-x2-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

## Estimando o efeito causal de `\(X\)` sobre `\(Y\)`?


.pull-left[


- Para estimar um efeito causal usando um modelo estatístico, precisamos encontrar um conjunto de variáveis `\(Z\)` que podemos controlar, de forma que o efeito causal de `\(do(X)\)` sobre `\(Y\)` seja igual ao efeito estatístico de `\(X\)` sobre `\(Y\)` controlando por `\(Z\)`.
.center[
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
    `\(p(y \mid do(x)) = \sum_z p(y \mid x, z)\, p(z)\)`
    ]]

- Em quais condições existe um conjunto de variáveis `\(Z\)` que podemos controlar para estimar o efeito causal de `\(X\)` sobre `\(Y\)`?

]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-xy-do-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
] 

---

## Caminhos 

.pull-left[
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Caminhos que contêm cadeias ou bifurcações não controladas ficam abertos.**]

- *X* → *Z* → *Y*
    - lm(y ~ x) : aberto
    - lm(y ~ x + z) : fechado

- *X* ← *Z* → *Y*
    - lm(y ~ x) : aberto
    - lm(y ~ x + z) : fechado
]

--

.pull-right[
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Caminhos que contêm colisores ficam fechados por padrão, mas se abrem quando condicionamos no colisor.**]

- *X* → *Z* ← *Y*
    - lm(y ~ x) : fechado
    - lm(y ~ x + z) : aberto

]

--

Ferramentas automatizadas: 

 - [dagitty.net](http://www.dagitty.net/dags.html)
 - [dagitty R package](https://cran.r-project.org/web/packages/dagitty/index.html)

## Identifique todos os caminhos abertos de `\(X\)` a `\(Y\)`



&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-caminhos-dag-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;

---

## Todos os caminhos de `\(X\)` a `\(Y\)`

.pull-left[
1. `\(X \rightarrow W \rightarrow Y\)`: **causal**, aberto

2. `\(X \leftarrow Z \rightarrow Y\)`: aberto

3. `\(X \leftarrow A \rightarrow Z \rightarrow Y\)`: aberto

4. `\(X \leftarrow Z \leftarrow B \rightarrow Y\)`: aberto

5. `\(X \leftarrow A \rightarrow Z \leftarrow B \rightarrow Y\)`: **fechado** (`\(Z\)` é um colisor)
]

.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-caminhos-dag-lista-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

---

## Critério da porta dos fundos (Backdoor criterion)

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
    Para estimar o efeito causal de `\(X\)` sobre `\(Y\)`, identifique um conjunto de variáveis de controle que não contenha descendentes de `\(X\)` e bloqueie todos os caminhos entre `\(X\)` e `\(Y\)` que incluam uma seta apontando para `\(X\)`.
    ]

.pull-left[
- Descendentes de `\(X\)` não podem ser incluídos como variáveis de controle (nenhuma variável pós-tratamento).

- Todos os caminhos entre `\(X\)` e `\(Y\)` que incluam uma seta apontando para `\(X\)` devem ser bloqueados. 
]
--
.pull-right[
- Variáveis no meio de cadeias e bifurcações **bloqueiam** caminhos quando incluídas nos modelos.

- Variáveis que são colisores **abrem** caminhos quando incluídas nos modelos.
]

---

## Aplicando o critério da porta dos fundos

.pull-left[
- Os caminhos 2 a 5 têm uma seta apontando para `\(X\)`. Os caminhos 2, 3 e 4 estão abertos e precisam ser fechados; o 5 já está fechado.

- Controlar só por `\(Z\)` fecha 2, 3 e 4, mas **abre** o 5, pois `\(Z\)` é um colisor nesse caminho.

- Incluir também `\(A\)` ou `\(B\)` fecha o caminho 5 de novo.

- `\(W\)` é descendente de `\(X\)` e não pode entrar no modelo.

Modelos que estimam o efeito causal de `\(X\)` sobre `\(Y\)`:

- `lm(Y ~ X + Z + A)`
- `lm(Y ~ X + Z + B)`
]

.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-caminhos-dag-criterio-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

---

## Critério da porta da frente (Front-door criterion)

.pull-left[
- E quando a porta dos fundos não pode ser fechada (confundidor não observado)?

- Se todo o efeito de `\(X\)` em `\(Y\)` passa por um mediador `\(M\)` sem confundimento, podemos estimar o efeito em duas partes:
  - `\(X \to M\)`: sem porta dos fundos aberta (o caminho por `\(U\)` passa pelo colisor `\(Y\)`).
  - `\(M \to Y\)`: a porta dos fundos `\(M \leftarrow X \leftarrow U \to Y\)` é fechada condicionando em `\(X\)`.

- Em modelos lineares, o efeito de `\(X\)` em `\(Y\)` é o produto `\(\beta_{XM} \times \beta_{MY}\)`.
]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-porta-frente-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

`\(M\)`: depósito de alcatrão nos pulmões. Se as suposições do DAG valerem, o efeito do tabagismo pode ser estimado mesmo que o genótipo proposto por Fisher (Aula I) não seja observado.
]

## HIV e acidente vascular cerebral



&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-hiv-avc-1.png" alt="" width="85%" style="display: block; margin: auto;" /&gt;

---

## HIV e AVC: um modelo para cada efeito

.pull-left[
- **Efeito do HIV**: fechar as portas dos fundos por Tabagismo e Idade.
    - `lm(AVC ~ HIV + Tabagismo + Idade)`

- **Efeito do Tabagismo**: fechar a porta dos fundos por Idade, sem incluir o HIV (mediador).
    - `lm(AVC ~ Tabagismo + Idade)`

- **Efeito da Idade**: não há portas dos fundos; HIV e Tabagismo são mediadores.
    - `lm(AVC ~ Idade)`
]

.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-hiv-avc-modelos-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

No modelo completo, só o coeficiente do HIV estima um efeito total. Os coeficientes de Tabagismo e Idade estimam apenas efeitos diretos, não totais.
]

---

## HIV e AVC: um confundidor não observado

.pull-left[
- **Efeito do HIV**: continua estimável. Condicionar no Tabagismo também fecha HIV ← Tabagismo ← Álcool → AVC.
    - `lm(AVC ~ HIV + Tabagismo + Idade)`

- **Efeito do Tabagismo**: **não é mais estimável**. A porta dos fundos Tabagismo ← Álcool → AVC só seria fechada medindo o álcool.

- **Efeito da Idade**: continua estimável. O caminho Idade → Tabagismo ← Álcool → AVC está fechado, pois o Tabagismo é um colisor.
    - `lm(AVC ~ Idade)`
]

.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-hiv-avc-alcool-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

No modelo completo, condicionar no Tabagismo abre o caminho Idade → Tabagismo ← Álcool → AVC: o coeficiente da Idade fica enviesado até como efeito direto.
]

---

## Quando podemos estimar efeitos diretos?

.pull-left[
- Para estimar o efeito direto de `\(X\)` sobre `\(Y\)`, condicionamos nos mediadores `\(M\)`. Isso só funciona se:
    1. os caminhos não causais entre `\(X\)` e `\(Y\)` estão fechados;
    2. todos os caminhos indiretos `\(X \to M \to Y\)` estão bloqueados;
    3. **não há confundidor aberto entre `\(M\)` e `\(Y\)`**: condicionar em `\(M\)` abre `\(X \to M \leftarrow U \to Y\)`.

- O efeito total continua estimável com `lm(Y ~ X)`; o efeito direto, não.
]

.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figura-dag-efeito-direto-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

- **Idade e AVC**: o Tabagismo é mediador e colisor (Idade → Tabagismo ← Álcool).
- **Intervenção educacional (Aula I)**: o perfil da família afeta a qualidade parental e a nota.
- **Fragmentação (Aula I)**: a qualidade do habitat pode afetar os predadores (mediador) e a sobrevivência.
]

---

## Outras variáveis de controle

.pull-left[
- Às vezes, não temos nenhum caminho não causal aberto entre `\(X\)` e `\(Y\)`, mas acrescentar variáveis no modelo pode melhorar ou piorar a precisão da estimativa do efeito causal de `\(X\)` sobre `\(Y\)`.

- Pais de `\(Y\)` que não são pais de `\(X\)` podem ser incluídos para reduzir a variância da estimativa do efeito de `\(X\)` sobre `\(Y\)`.

- No DAG ao lado, incluir `\(Z\)` no modelo não muda a estimativa do efeito de `\(X\)` sobre `\(Y\)`, mas reduz a variância da estimativa.

- A variância de `\(Y\)` capturada por `\(Z\)` ajuda a localizar o efeito de `\(X\)` sobre `\(Y\)`.
]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figure-dag-precision-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

---

## Outras variáveis de controle (precision sink)


.pull-left[
- Por outro lado, também é possível piorar a precisão da estimativa incluindo variáveis de controle equivocadas.
   
- Pais de `\(X\)` que não afetam `\(Y\)` pioram a precisão da estimativa.

- No DAG ao lado, incluir `\(Z\)` no modelo não muda a estimativa do efeito de `\(X\)` sobre `\(Y\)`, mas aumenta a variância da estimativa.

- Incluir `\(Z\)` reduz a quantidade de variância de `\(X\)` que é usada para estimar o efeito de `\(X\)` sobre `\(Y\)`, aumentando a variância da estimativa.
]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figure-dag-sink-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
&gt; Não inclua `\(Z\)` nesse caso!
]

---


## Outras variáveis de controle (bias amplification)


.pull-left[
- A situação é mais grave ainda quando existe uma bifurcação entre `\(X\)` e `\(Y\)` e incluímos uma variável de controle que é um pai de `\(X\)` que não afeta `\(Y\)`.

- Nesse caso, a inclusão de `\(Z\)` no modelo é catastrófica.

- A inclusão de `\(Z\)`:
  -  remove a variância de `\(X\)` que seria preditora de `\(Y\)` diretamente, e, portanto
  -  amplifica o efeito da variância de `\(X\)` que é causada por `\(U\)`, aumentando o viés da estimativa do efeito de `\(X\)` sobre `\(Y\)`.
]
.pull-right[
&lt;img src="Aula_Inferencia_Causal_II_files/figure-html/figure-dag-bias-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
&gt; Não inclua `\(Z\)` nesse caso (MESMO)!
]

--

[Pearl, J. (2011) Understanding bias amplification. American Journal of Epidemiology, 174(11), 1223–1227](https://doi.org/10.1093/aje/kwr352)


---


## Bons controles

- **Confundidores** (bifurcações): causas comuns de `\(X\)` e `\(Y\)`. Incluí-los fecha caminhos não causais pela porta dos fundos.

- **Variáveis no caminho de uma porta dos fundos**: mesmo quando o confundidor não é observado, condicionar em outra variável ao longo do caminho (ex.: `\(U \to Z \to X\)`) já o fecha.

- **Causas de `\(Y\)` que não afetam `\(X\)`**: não mudam a estimativa, mas aumentam a precisão, pois explicam parte da variação de `\(Y\)`.

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt4[
Um bom conjunto de controles satisfaz o critério da porta dos fundos: bloqueia todos os caminhos não causais entre `\(X\)` e `\(Y\)`, sem incluir descendentes de `\(X\)`.
]

---

## Maus controles

- **Mediadores e outros descendentes de `\(X\)`** (variáveis pós-tratamento): bloqueiam total ou parcialmente o caminho causal e subestimam o efeito total.

- **Colisores e seus descendentes**: abrem caminhos não causais e criam associações espúrias, inclusive quando a amostra é selecionada com base no colisor.

- **Causas de `\(X\)` que não afetam `\(Y\)`**: reduzem a precisão e, se houver confundimento não observado, amplificam o viés.

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt4[
Nenhum critério estatístico (AIC, p-valor, `\(R^2\)`) distingue bons de maus controles. A escolha depende do modelo causal, e não dos dados.
]

Para um catálogo completo, veja Cinelli, Forney e Pearl (2024).
