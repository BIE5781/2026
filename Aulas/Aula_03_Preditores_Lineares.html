## Recapitulando

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Uma expressão geral para modelos estatísticos**

`$$Y\, \sim \, f(Y \mid \Theta=g(X_i))$$`
]

--

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Em palavras**

`\(Y\)` é uma variável aleatória, cujos valores têm probabilidades
definidas pela função de densidade `\(f(Y)\)`, cujos parâmetros
`\(\Theta\)` são uma função qualquer `\(g\)` de outras medidas
(preditoras) `\(X_i\)`.
]

---

## Preditores lineares

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Todos que podem ser escritos na forma**

`$$\theta \ = \ g(X_i) \ = \sum \beta_iX_i$$`
]

sendo `\(\theta\)` uma resposta (que normalmente usamos para expressar a
dependência que um parâmetro da distribuição tem com outras medidas).

---

## Preditores lineares

### Exemplos

* `\(\beta_0+\beta_1X_1\)` , sendo `\(X_0=1\)`

--

* `\(\beta_0+\beta_1X_1+\beta_2X_1^2\)` , pois podemos chamar `\(X_1^2\)` de `\(X_2\)`

--

* `\(\beta_0+\beta_1X_1+\beta_2\ln(X_1)\)` , pois podemos chamar `\(\ln X_1\)` de `\(X_2\)`

--

* `\(\beta_0+\beta_1X_1+\beta_2X_2+\beta_3X_1X_2\)` , pois podemos chamar `\(X_1X_2\)` de `\(X_3\)`

--

* `\(\ldots\)`

---
## Modelos lineares múltiplos aditivos

* O preditor é a soma de variáveis independentes isoladas, cada uma multiplicada por seu coeficiente.

--

* A soma **não** inclui variáveis independentes que são produtos de outras presentes no modelo:

`$$\beta_0+\beta_1X_1+\beta_2X_2 + \cdots + \beta_iX_i$$`

--

* Se uma variável independente `\(X_i\)` aumenta em uma unidade, o preditor aumenta `\(\beta_i\)` , não importando o valor das outras variáveis.

--

* Ou seja, os efeitos das preditoras são **aditivos**. Não são afetados pelo valor das demais variáveis.

---

## Interpretação dos coeficientes de modelos lineares múltiplos



``` r
&gt; ## Especifica o modelo
&gt; m.pais.f &lt;- alist( H ~ dnorm( mu, exp(lsigma) ),
+                    mu &lt;- a + bPai * pai + bMae * mae)
```


``` r
&gt; ## Valores iniciais
&gt; inicio.a &lt;- mean(dat$H)
&gt; inicio.ls &lt;- log(sd(dat$H))
&gt; ## Ajuste
&gt; m.pais &lt;- quap( m.pais.f, data = dat,
+     start = list(a = inicio.a, bPai = 0, bMae = 0, lsigma = inicio.ls))
&gt; ## Coeficientes
&gt; precis(m.pais)
```

.pull-left[

`$$\mu = \alpha + \beta_{\text{mãe}}\, \text{mae} + \beta_{\text{menina}}\, \text{menina}$$`

{{content}}

--

* **Meninas** ( `\(\text{menina} = 1\)` ): `\(\mu = [\alpha + \beta_{\text{menina}}] + \beta_{\text{mãe}}\, \text{mae}\)`

## Tentação: uma coluna com 0, 1, 2

.center[
&lt;img src="Aula_03_Preditores_Lineares_files/figure-html/uma-coluna-1.png" alt="" width="90%" /&gt;
]

Uma coluna só impõe uma **ordem** e **distâncias iguais** entre os grupos. Mudando os rótulos, muda o modelo.
Além disso:  reta ignora a média do grupo do meio trt1 tem a menor média de todas, mas não influencia a inclinação.

---
## Solução: coluna indicadora para cada nível

.pull-left[

| grupo  | `\(x_1\)` | `\(x_2\)` | `\(x_3\)` |
|:------:|:-----:|:-----:|:-----:|
| `ctrl` | 1     | 0     | 0     |
| `trt1` | 0     | 1     | 0     |
| `trt2` | 0     | 0     | 1     |

]

.pull-right[

`$$\mu = \beta_1 x_1 + \beta_2 x_2 + \beta_3 x_3$$`

{{content}}
]

--

* `ctrl`: `\(\mu = \beta_1\)`
* `trt1`: `\(\mu = \beta_2\)`
* `trt2`: `\(\mu = \beta_3\)`

{{content}}

--

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt4[
Cada coeficiente é a média de um grupo.
]

## Uma coluna indicadora para cada nível


``` r
&gt; pg$x1 &lt;- ifelse(pg$group == "ctrl", 1, 0)
&gt; pg$x2 &lt;- ifelse(pg$group == "trt1", 1, 0)
&gt; pg$x3 &lt;- ifelse(pg$group == "trt2", 1, 0)
&gt; m.ind &lt;- quap(
+     alist(
+         weight ~ dnorm(mu, exp(lsigma)),
+         mu &lt;- b1 * x1 + b2 * x2 + b3 * x3
+     ), data = pg,
+     start = list(b1 = 5, b2 = 5, b3 = 5, lsigma = 0))
&gt; precis(m.ind)
```

## E se incluirmos um intercepto?

`$$\mu = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + \beta_3 x_3$$`

--

Como `\(x_1 + x_2 + x_3 = 1\)` sempre, há infinitas soluções para as mesmas médias:

| Solução | `\(\beta_0\)` | `\(\beta_1\)` | `\(\beta_2\)` | `\(\beta_3\)` |
|:-------:|:--------:|:---------:|:---------:|:---------:|
| A       | 0        | 5.03      | 4.66      | 5.53      |
| B       | 5        | 0.03      | −0.34     | 0.53      |
| C       | 10       | −4.97     | −5.34     | −4.47     |

--

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
Com intercepto, bastam `\(k-1\)` colunas. Mas que valores colocar nelas?
]

## Contrastes

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Contraste**: uma regra para reescrever as `\(k\)` médias como um intercepto e `\(k-1\)` coeficientes.
]

`$$\mu = \beta_0 + \beta_1 c_1 + \beta_2 c_2$$`

--

* A regra é uma **matriz**: os valores de `\(c_1\)` e `\(c_2\)` em cada grupo.

--

* Contrastes diferentes dão as **mesmas médias** e a **mesma verossimilhança**.

--

* O que muda é o **significado dos coeficientes**.

--

* Escolher o contraste é escolher que **perguntas** os coeficientes respondem.

---

## Contraste de controle

.pull-left[

| grupo  | `\(c_1\)` | `\(c_2\)` | `\(\mu\)` |
|:------:|:-----:|:-----:|:-----:|
| `ctrl` | 0     | 0     | `\(\beta_0\)` |
| `trt1` | 1     | 0     | `\(\beta_0 + \beta_1\)` |
| `trt2` | 0     | 1     | `\(\beta_0 + \beta_2\)` |

]

.pull-right[

* `\(\beta_0 = \mu_{ctrl}\)`

* `\(\beta_1 = \mu_{trt1} - \mu_{ctrl}\)`

* `\(\beta_2 = \mu_{trt2} - \mu_{ctrl}\)`

]

--

&lt;br&gt;
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
Cada coeficiente é a diferença de um grupo em relação ao grupo de **referência**.

A coluna `menina` do exemplo do Galton era um contraste de controle, com os meninos como referência.
]

---
## Contraste de controle

A matriz de contraste vira colunas no `data`:


``` r
&gt; C.trat &lt;- rbind(ctrl = c(0, 0), trt1 = c(1, 0), trt2 = c(0, 1))
&gt; colunas &lt;- function(C, grupo, y)
+     data.frame(y = y, c1 = C[as.character(grupo), 1], c2 = C[as.character(grupo), 2])
&gt; ## Modelo e valores iniciais: os mesmos para todos os contrastes
&gt; f.contr &lt;- alist(y ~ dnorm(mu, exp(lsigma)),
+                  mu &lt;- a + b1 * c1 + b2 * c2)
&gt; inicio &lt;- list(a = 5, b1 = 0, b2 = 0, lsigma = 0)
&gt; m.trat &lt;- quap(f.contr, data = colunas(C.trat, pg$group, pg$weight), start = inicio)
&gt; precis(m.trat)
```

```
             mean        sd        5.5%       94.5%
a       5.0319936 0.1870100  4.73311549  5.33087161
b1     -0.3709760 0.2644720 -0.79365342  0.05170139
b2      0.4939948 0.2644720  0.07131739  0.91667220
lsigma -0.5253008 0.1290977 -0.73162382 -0.31897773
```

## Contraste de soma

.pull-left[

| grupo  | `\(c_1\)` | `\(c_2\)` | `\(\mu\)` |
|:------:|:-----:|:-----:|:-----:|
| `ctrl` | 1     | 0     | `\(\beta_0 + \beta_1\)` |
| `trt1` | 0     | 1     | `\(\beta_0 + \beta_2\)` |
| `trt2` | −1    | −1    | `\(\beta_0 - \beta_1 - \beta_2\)` |

]

.pull-right[

* `\(\beta_0 = \frac{\mu_{ctrl} + \mu_{trt1} + \mu_{trt2}}{3}\)`

* `\(\beta_1 = \mu_{ctrl} - \beta_0\)`

* `\(\beta_2 = \mu_{trt1} - \beta_0\)`

]

--

&lt;br&gt;
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
Cada coeficiente é o desvio de um grupo em relação à **média das médias**.

O desvio do último grupo não tem coeficiente próprio: é `\(-(\beta_1 + \beta_2)\)`.
]

---

&gt; C.soma &lt;- rbind(ctrl = c(1, 0), trt1 = c(0, 1), trt2 = c(-1, -1))

## Contraste de Helmert

Cada grupo comparado com a média dos grupos **anteriores**. Com a ordem `trt1`, `trt2`, `ctrl`:

.pull-left[

| grupo  | `\(c_1\)` | `\(c_2\)` | `\(\mu\)` |
|:------:|:-----:|:-----:|:-----:|
| `trt1` | −1    | −1    | `\(\beta_0 - \beta_1 - \beta_2\)` |
| `trt2` | 1     | −1    | `\(\beta_0 + \beta_1 - \beta_2\)` |
| `ctrl` | 0     | 2     | `\(\beta_0 + 2\beta_2\)` |

]

.pull-right[

* `\(\beta_0 =\)` média das médias

* `\(\beta_1 = \frac{1}{2}(\mu_{trt2} - \mu_{trt1})\)`

* `\(\beta_2 = \frac{1}{3}\left(\mu_{ctrl} - \frac{\mu_{trt1} + \mu_{trt2}}{2}\right)\)`

]

--

&lt;br&gt;
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
`\(\beta_1\)`: os tratamentos diferem entre si? `\(\beta_2\)`: o controle difere da média dos tratamentos?
]

---

&gt; C.helm &lt;- rbind(trt1 = c(-1, -1), trt2 = c(1, -1), ctrl = c(0, 2))

# Como o R faz isso

---
## Fatores no `lm()`


``` r
&gt; coef(lm(Height ~ mae + Gender, data = gal))
```

```
(Intercept)         mae     GenderM 
 65.2873472   0.3487784   5.1542925 
```

--

* O coeficiente se chama `GenderM` e tem o sinal trocado em relação ao `bMenina` do `quap()`.

--

* O R fez a codificação sozinho, com o **contraste de controle**.

--

* A referência é o primeiro nível do fator, em ordem alfabética: `"F"`.

## Síntese

| Contraste | No R | Intercepto | Coeficientes |
|:---------:|:----:|:----------:|:------------:|
| Controle | `contr.treatment` (padrão) | média do grupo de referência | diferença de cada grupo para a referência |
| Soma | `contr.sum` | média das médias | desvio de cada grupo (menos o último) para a média das médias |
| Helmert | `contr.helmert` | média das médias | cada grupo contra a média dos anteriores (em escala) |

&lt;br&gt;
.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
O contraste não é uma propriedade dos dados: é uma escolha, guiada pelas perguntas que queremos que os coeficientes respondam.
]

## Modelos lineares múltiplos com interações

* O preditor inclui variáveis que são produtos de pelo menos outras duas presentes no modelo, por exemplo:

`$$\beta_0+\beta_1X_1+\beta_2X_2 + \beta_3X_1X_2$$`

--


* Se a variável independente `\(X_1\)` aumenta em uma unidade, o preditor aumenta em `\(\beta_1 + \beta_3 X_2\)`.

--

* Ou seja, o efeito de uma preditora depende do valor de outra(s). Há uma **interação** estatística.

---

## Exemplo de preditor linear com uma interação

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Duas preditoras:**

* `\(X_1\)`: altura da mãe (`mae`), contínua
* `\(X_2\)`: gênero binário atribuído (`menina`: menino = 0, menina = 1)
]

--

### Preditor:

* **expressão**: `\(\beta_0 + \beta_1X_1 + \beta_2X_2 + \beta_3X_1X_2\)`

--

* **masculino**: `\(\beta_0 + \beta_1X_1 + \beta_2\times 0 + \beta_3X_1\times 0 \ = \ \beta_0 + \beta_1X_1\)`

--

* **feminino**: `\(\beta_0 + \beta_1X_1 + \beta_2\times 1 + \beta_3X_1\times 1 \ = \ [\beta_0 + \beta_2] + [\beta_1 + \beta_3]X_1\)`

---

## Gráfico do exemplo com interação

.center[
&lt;img src="Aula_03_Preditores_Lineares_files/figure-html/plot-teorico-interacao-1.png" alt="" width="45%" /&gt;
]

---

## E o que são preditores não lineares?

Todos que não podem ser reduzidos à forma `\(\Theta \ = \ \sum \beta_iX_i\)`.

.bg-washed-blue.b--navy.ba.bw2.br3.shadow-5.ph4.mt1[
**Exemplos**

* `\(\beta_0X_1^{\beta_1}\)`

* `\(\beta_0e^{\beta_1 X_1}\)`

* `\(\frac{\beta_1 X_1}{1+\beta_1\beta_2X_1}\)`

* E muitas, muitas mais.
]
